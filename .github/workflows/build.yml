name: Gerar APK e instalador

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.14.3" }
      - name: Compilar APK
        working-directory: android
        run: gradle assembleRelease --no-daemon
      - run: cp android/app/build/outputs/apk/release/app-release.apk ControleRemoto-Android.apk
      - uses: actions/upload-artifact@v4
        with: { name: apk, path: ControleRemoto-Android.apk }

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Gerar ControleRemoto.exe
        run: |
          pip install pyinstaller
          pyinstaller --onefile --noconsole --name ControleRemoto windows/controle_remoto.py
      - name: Gerar instalador
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" windows\instalador.iss
      - uses: actions/upload-artifact@v4
        with: { name: instalador, path: saida/ControleRemoto-Instalador-Windows.exe }

  publicar:
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.8.${{ github.run_number }}
          name: Controle Remoto 1.8.${{ github.run_number }}
          make_latest: true
          body: |
            **Tablet Android:** baixe e instale o `ControleRemoto-Android.apk` (permita "instalar apps desconhecidos").
            **Notebook Windows:** baixe e execute o `ControleRemoto-Instalador-Windows.exe`.
          files: |
            ControleRemoto-Android.apk
            ControleRemoto-Instalador-Windows.exe
